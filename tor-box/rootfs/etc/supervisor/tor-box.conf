[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry 1600x900 -depth 24 -rfbport 5901 -localhost -SecurityTypes None -AlwaysShared
user=app
environment=HOME="/home/app",USER="app"
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox
user=app
environment=HOME="/home/app",USER="app",DISPLAY=":1"
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
user=root
priority=30
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:torbrowser]
command=/usr/local/bin/start-browser.sh
user=app
environment=HOME="/home/app",USER="app",DISPLAY=":1"
priority=40
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
